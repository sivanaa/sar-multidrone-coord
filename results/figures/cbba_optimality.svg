<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' role="img" aria-labelledby="cbba_optimality-t cbba_optimality-d">
